name: Build Debian package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          docker compose -f packaging/docker/docker-compose.yml run --rm debian-bookworm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: packaging/dist/*.deb

      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*.deb